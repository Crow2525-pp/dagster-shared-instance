scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

run_launcher:
  module: dagster_docker
  class: DockerRunLauncher
  config:
    env_vars:
      - DAGSTER_NETWORK
      - DAGSTER_POSTGRES_HOST
      - DAGSTER_POSTGRES_PORT
      - DAGSTER_POSTGRES_DB
      - DAGSTER_POSTGRES_USER
      - DAGSTER_POSTGRES_PASSWORD
      - POSTGRES_ADMIN_USER
      - POSTGRES_ADMIN_PASSWORD
      - PERSONAL_FINANCE_POSTGRES_HOST
      - PERSONAL_FINANCE_POSTGRES_PORT
      - PERSONAL_FINANCE_POSTGRES_DB
      - PERSONAL_FINANCE_POSTGRES_USER
      - PERSONAL_FINANCE_POSTGRES_PASSWORD
      - PERSONAL_FINANCE_POSTGRES_ADMIN_USER
      - PERSONAL_FINANCE_POSTGRES_ADMIN_PASSWORD
      - PERSONAL_FINANCE_GRAFANA_USER
      - DBT_EXECUTION_CONTEXT
      - GRAFANA_URL
      - GRAFANA_USER
      - GRAFANA_ADMIN_PASSWORD
      - GRAFANA_TOKEN
      - DASHBOARD_POLICY_GATE_WARN_ONLY
      - DASHBOARD_QUALITY_WARN_ONLY
      - KEEP_SYNC_ENABLED
      - GOOGLE_KEEP_TOKEN_PATH
      - GOOGLE_KEEP_LIST_NAME
      - GOOGLE_KEEP_EMAIL
      - COLES_STATE_PATH
      - KEEP_AUTO_ADD_MIN_CONFIDENCE
      - KEEP_DELETE_ON_ADD
      - ANTHROPIC_API_KEY
      - USE_NIX_DEVSHELL
      - PLAYWRIGHT_HEADED
      - HA_URL
      - HA_TOKEN
      - HA_NOTIFY_SERVICE
      # coles-llm-shopper: HA Telegram-bot entry that announces submitted orders
      - HA_TELEGRAM_CONFIG_ENTRY_ID
      # home-climate comfort job: recorder SSH harvest, app DB, and digest/alert
      - HOME_CLIMATE_POSTGRES_DB
      - HA_RECORDER_SSH_HOST
      - HA_RECORDER_DB_PATH
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - ALERTMANAGER_URL
      # Escape hatch for a KNOWN-INCOMPLETE harvest when the recorder SSH path is
      # genuinely unavailable. Off by default: the harvest now fails rather than
      # silently degrading to the HA history API (which cannot see attribute-only
      # vote rows). Set to 1 here and rebuild the daemon only for a deliberate,
      # time-boxed recovery. See home-climate-dagster PR #6.
      - HARVEST_ALLOW_HISTORY_FALLBACK=0
    network:
      env: DAGSTER_NETWORK
    container_kwargs:
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /tmp/io_manager_storage:/tmp/io_manager_storage
        - /tmp/dagster-data:/tmp/dagster-data
        # coles-llm-shopper run workers need the data volume to reach
        # coles_state.json and keep_token.json at runtime.
        - coles-llm-shopper_coles_data:/app/data
        # Finance run workers must receive the same private inputs as the
        # code-location container. These are read-only: ingestion/dbt may read
        # them but must never mutate host QIF exports or balance-anchor seeds.
        - /docker/data/qif_personal_finance/qif_files:/app/pipeline_personal_finance/qif_files:ro
        - /home/phil/projects/qif_personal_finance/pipeline_personal_finance/dbt_finance/seeds/known_values.csv:/app/pipeline_personal_finance/dbt_finance/seeds/known_values.csv:ro
        - /home/phil/projects/qif_personal_finance/pipeline_personal_finance/dbt_finance/seeds/mortgage_patch_data.csv:/app/pipeline_personal_finance/dbt_finance/seeds/mortgage_patch_data.csv:ro
        - /home/phil/projects/qif_personal_finance/pipeline_personal_finance/dbt_finance/seeds/property_assets.csv:/app/pipeline_personal_finance/dbt_finance/seeds/property_assets.csv:ro
        - /home/phil/projects/qif_personal_finance/pipeline_personal_finance/dbt_finance/seeds/property_valuation_overrides.csv:/app/pipeline_personal_finance/dbt_finance/seeds/property_valuation_overrides.csv:ro
        - /home/phil/projects/qif_personal_finance/pipeline_personal_finance/dbt_finance/seeds/recommendation_outcomes.csv:/app/pipeline_personal_finance/dbt_finance/seeds/recommendation_outcomes.csv:ro
        - /home/phil/projects/qif_personal_finance/pipeline_personal_finance/dbt_finance/seeds/r001_flow_exclusions.csv:/app/pipeline_personal_finance/dbt_finance/seeds/r001_flow_exclusions.csv:ro
        # home-climate run workers SSH to the HA recorder. These MUST match the
        # paths the home-climate code-location container mounts, because assets
        # execute in per-run containers launched by DockerRunLauncher, not in the
        # code-location container. The previous `/home/phil/.ssh:/root/.ssh:ro`
        # mount was unusable: the image runs as uid 1000 (home-climate) and /root
        # is mode 0700, so every harvest failed with ssh exit 255 and silently
        # fell back to the HA history API. See CLO Correction Review 2026-09-02.
        - /home/phil/.ssh/ha_recorder_home_climate:/run/secrets/ha_recorder_ssh_key:ro
        - /home/phil/.ssh/ha_recorder_known_hosts:/run/secrets/ha_recorder_known_hosts:ro

run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_POSTGRES_HOST
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port:
        env: DAGSTER_POSTGRES_PORT

schedule_storage:
  module: dagster_postgres.schedule_storage
  class: PostgresScheduleStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_POSTGRES_HOST
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port:
        env: DAGSTER_POSTGRES_PORT

event_log_storage:
  module: dagster_postgres.event_log
  class: PostgresEventLogStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_POSTGRES_HOST
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port:
        env: DAGSTER_POSTGRES_PORT

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /tmp/dagster-compute-logs
